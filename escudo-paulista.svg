<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" width="440" height="590" role="img" aria-label="Escudo do A. E. F. Paulista - fundado em 1938">
  <title>A. E. F. Paulista - 1938</title>

  <defs>
    <!-- Contorno do escudo, reaproveitado como recorte das listras -->
    <path id="escudo"
          d="M 46,110 H 394 A 16 16 0 0 1 410,126 V 356
             C 410,450 336,522 220,570
             C 104,522 30,450 30,356
             V 126 A 16 16 0 0 1 46,110 Z"/>
    <clipPath id="recorte">
      <use href="#escudo"/>
    </clipPath>

    <!-- Monograma cursivo "aepf": letras em sequencia, ligadas na linha de base -->
    <g id="monograma">
      <!-- a -->
      <path d="M 68,66 C 60,58 42,56 32,68 C 22,80 24,98 38,104 C 52,110 64,102 68,94"/>
      <path d="M 68,62 C 68,78 66,94 70,103 C 74,110 82,110 92,102"/>
      <!-- e -->
      <path d="M 92,102 C 100,92 104,78 114,70 C 122,64 130,68 127,78
               C 124,88 112,92 104,94 C 98,96 98,104 104,108 C 112,113 126,110 138,101"/>
      <!-- ligacao e-p -->
      <path d="M 138,101 C 146,96 152,96 158,100"/>
      <!-- p -->
      <path d="M 158,100 C 164,90 168,78 172,66 C 173,61 171,59 169,67
               C 165,87 161,118 159,140 C 158,152 164,154 168,146"/>
      <path d="M 170,70 C 182,60 198,62 198,77 C 198,93 182,101 168,97"/>
      <path d="M 168,97 C 180,105 196,104 208,96"/>
      <!-- f -->
      <path d="M 208,96 C 220,84 232,62 240,42 C 246,26 244,14 236,18
               C 228,22 228,42 230,60 C 232,82 228,116 222,136
               C 218,150 208,152 206,142 C 204,133 214,127 226,125
               C 240,123 254,117 264,108"/>
    </g>
  </defs>

  <!-- Estrela amarela, acima do escudo -->
  <polygon points="220,6 231,35 262,36 238,56 246,86 220,69 194,86 202,56 178,36 209,35"
           fill="#F5C518" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- Corpo do escudo: miolo branco com listras verticais pretas -->
  <g clip-path="url(#recorte)">
    <rect x="24" y="102" width="392" height="480" fill="#ffffff"/>

    <rect x="24"  y="102" width="24" height="480" fill="#111111"/>
    <rect x="90"  y="102" width="42" height="480" fill="#111111"/>
    <rect x="308" y="102" width="42" height="480" fill="#111111"/>
    <rect x="392" y="102" width="24" height="480" fill="#111111"/>

    <!-- Faixa com o nome do clube -->
    <rect x="24" y="153" width="392" height="5"  fill="#ffffff"/>
    <rect x="24" y="158" width="392" height="56" fill="#111111"/>
    <rect x="24" y="214" width="392" height="5"  fill="#ffffff"/>

    <text x="220" y="197" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="700" letter-spacing="1.5" fill="#ffffff">A. E. F. PAULISTA</text>

    <!-- Monograma: halo branco por baixo para destacar sobre as listras -->
    <g transform="translate(220,322) scale(0.82) translate(-144,-85)"
       fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#monograma" stroke="#ffffff" stroke-width="22"/>
      <use href="#monograma" stroke="#111111" stroke-width="11"/>
    </g>

    <!-- Ano de fundação -->
    <text x="220" y="502" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="56" font-weight="700" letter-spacing="1" fill="#111111">1938</text>
  </g>

  <!-- Borda: preto / filete branco / preto -->
  <use href="#escudo" fill="none" stroke="#111111" stroke-width="22" stroke-linejoin="round"/>
  <use href="#escudo" fill="none" stroke="#ffffff" stroke-width="5"  stroke-linejoin="round"/>
</svg>
